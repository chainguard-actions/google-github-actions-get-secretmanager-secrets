name: Test action fails gracefully without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid secret ref but no GCP credentials
        id: action
        uses: .
        with:
          secrets: |-
            myoutput:my-project/my-secret
        continue-on-error: true

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
