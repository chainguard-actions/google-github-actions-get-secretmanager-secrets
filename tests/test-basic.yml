name: Test basic secrets input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: get-secrets
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            MY_SECRET:my-project/my-secret

      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.get-secrets.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
