name: Test basic secrets input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-secrets
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            MY_SECRET:my-project/my-secret
      - name: Assert action ran (expected to fail without GCP credentials)
        env:
          OUTCOME: ${{ steps.get-secrets.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with secrets input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
