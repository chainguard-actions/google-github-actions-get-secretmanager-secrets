name: Test multiple secrets newline-separated format parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with multiple secrets in newline-separated format
        id: action
        uses: .
        with:
          secrets: |-
            output1:my-project/my-secret1
            output2:my-project/my-secret2
        continue-on-error: true

      - name: Assert action failed (no GCP credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (multiple secrets format parsed successfully)"
