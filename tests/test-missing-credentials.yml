name: Test missing credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unset any GCP credentials
        run: |
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset GOOGLE_CREDENTIALS || true
          unset GCLOUD_SERVICE_KEY || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            myoutput:my-project/my-secret

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without credentials"
