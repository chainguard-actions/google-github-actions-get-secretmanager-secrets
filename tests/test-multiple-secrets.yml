name: Test multiple secrets input formats
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-newline
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            secret1:my-project/my-secret1
            secret2:my-project/my-secret2
            secret3:my-project/my-secret3
      - name: Assert newline-separated secrets input accepted
        env:
          OUTCOME: ${{ steps.action-newline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no GCP credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with multiple newline-separated secrets"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-comma
        uses: .
        continue-on-error: true
        with:
          secrets: 'secret1:my-project/my-secret1,secret2:my-project/my-secret2'
      - name: Assert comma-separated secrets input accepted
        env:
          OUTCOME: ${{ steps.action-comma.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no GCP credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with multiple comma-separated secrets"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
