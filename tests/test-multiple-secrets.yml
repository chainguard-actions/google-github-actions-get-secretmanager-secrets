name: Test multiple secrets input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            secret_one:my-project/my-secret-1
            secret_two:my-project/my-secret-2
            secret_three:my-project/my-secret-3
      - name: Assert action ran and failed gracefully (no GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no GCP credentials available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (GCP credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
