name: Test multiple secrets input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            output1:my-project/my-secret1
            output2:my-project/my-secret2
            output3:my-project/my-secret3/versions/latest

      - name: Assert action ran with multiple secrets input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real GCP credentials), but it should
          # have accepted the multi-line secrets input without a parsing error.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with multiple secrets (outcome: $OUTCOME)"
