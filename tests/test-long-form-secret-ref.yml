name: Test - Long-form secret reference format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with long-form secret reference
        id: action
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            mytoken:projects/my-project-id/secrets/my-secret-id/versions/latest

      - name: Assert action ran (failed gracefully without GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no GCP credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials may be present)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
