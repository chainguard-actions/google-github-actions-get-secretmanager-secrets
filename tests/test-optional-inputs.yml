name: Test optional inputs (export_to_environment, encoding, min_mask_length)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with optional inputs set
        id: action
        uses: .
        with:
          secrets: |-
            myoutput:my-project/my-secret
          export_to_environment: 'true'
          encoding: 'base64'
          min_mask_length: '8'
        continue-on-error: true

      - name: Assert action failed (no GCP credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (optional inputs accepted)"
