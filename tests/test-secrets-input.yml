name: Test secrets input coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with secrets input (expect failure without credentials)
        id: action
        uses: .
        with:
          secrets: |-
            MY_SECRET:my-project/my-secret
        continue-on-error: true

      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
