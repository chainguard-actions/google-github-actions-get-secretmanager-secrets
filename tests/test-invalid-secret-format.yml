name: Test - Invalid secret format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid secret format (missing colon separator)
        id: action
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            this-is-not-a-valid-secret-reference

      - name: Assert action failed (invalid format or no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid format or missing credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
