name: Test export_to_environment input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          secrets: |-
            mytoken:my-project/my-secret
          export_to_environment: 'true'
          min_mask_length: '4'

      - name: Assert action failed at credential/API stage not input parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no real GCP credentials), but it should
          # have accepted the inputs without a parsing error. Either failure
          # or success is acceptable here — what matters is the action ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with export_to_environment=true (outcome: $OUTCOME)"
